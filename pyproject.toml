[project]
name = "stretchwatch"
version = "0.1.0"
description = "Quality of the Hartree-Fock starting point for VQE along bond-stretching curves of small molecules"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1", "pyscf>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stretchwatch = "stretchwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
